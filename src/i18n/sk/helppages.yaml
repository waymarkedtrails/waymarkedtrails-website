    a projekt OpenStreetMap a tieto stránky sú uvedené.
  usage: |-
    ## Podmienky používania

    You may use the overlay on other sites as long as access rates are moderate. Please
    cache tiles as often as possible and use a correct referrer. Mass download of tiles
    is strongly discouraged.

    GPX tracks are provided for the convenience of visitors of this site. Mass download
    is not allowed.
  disclaimer: "## Vylúčenie zodpovednosti\n\nNa stránkach nie je garantovaná presnosť
    ani úplnosť údajov. Ak chcete ísť na turistiku, zožeňte si riadnu papierovú mapu,
    vhodné oblečenie a výbavu a nenechávajte doma zdravý rozum. \nPríroda môže byť
    rovnako bezohľadná tak ako je krásna.\n\nTáto stránka obsahuje odkazy na externé
    stránky. Autor tejto stránky nemá na obsah vplyv a neberie zaň žiadnu zodpovednosť."
acknowledgements:
  title: Poďakovanie
  text: |-
    Všetky mapové údaje poskytuje [OpenStreetMap a prispievatelia](https://www.openstreetmap.org)
    a sú distribuované pod licenciou ODbL. Podkladovú mapu tiež láskavo poskytuje OSM.
    Viac informácií nájdete na
    [stránke o autorských právach OSM](https://www.openstreetmap.org/copyright).

    Podkladovú mapu OpenTopoMap-R láskavo poskytuje
    [openmaps.fr](https://openmaps.fr/about-openmaps.fr.html). Ak sa vám páči,
    zvážte, prosím, dar na údržbu ich serverov. Viac informácií nájdete na
    [stránke darov openmaps](https://openmaps.fr/donate).

    Tieňovanie reliéfu a výškové údaje boli vytvorené z kombinácie údajov SRTM a ASTER GDEM.
    ASTER GDEM je produkt METI a NASA.
    Následné spracovanie láskavo poskytol Yves Cainaud z [opensnowmap.org](https://opensnowmap.org).

    Kód výškového profilu vyvinul Espen Oldeman Lund v spolupráci medzi [Kresendo](https://www.kresendo.no) a projektom TG4NP na [Western Norway Research Institute](https://www.vestforsk.no).

    Variant zimných športových svahov vyvinul Michael Spreng. Symbol jazdy na koni
    pripravil Robert Whittaker.

    Ciele rázcestníkov spracoval [Mueschelsoft](http://osm.mueschelsoft.de/destinationsign/example/index.htm). Veľká vďaka Janovi Michelovi za poskytnutie tejto služby.

    Preklady tejto stránky poskytuje
    [translatewiki.net a jeho prispievatelia](https://translatewiki.net/wiki/Category:Waymarked_Trails_translators). Osobitné poďakovanie patrí priekopníckym prekladateľom, ktorí
    poskytli preklady ešte pred translatewiki.net: Yves Cainaud (francúzština),
    Oscar Formaggi (taliančina),
    Gustavo [Tuentibiker](https://www.blogger.com/profile/12473561703699888751) Ramis (španielčina),
    [Guttorm Flatabø](https://guttormflatabo.com)/TG4NP (nórsky bokmål a nynorsk),
    Mads Lumholt/TG4NP (dánčina), Magnús Smári Snorrason/TG4NP (islandčina),
    Lars Mikaelsson/TG4NP (švédčina) a Elina Pesonen (fínčina).
contact:
  title: Kontakt
  text: |-
    Otázky a pripomienky k tejto stránke môžete poslať na:  [lonvia@denofr.de](mailto:lonvia@denofr.de).

    Chyby môžete nahlásiť na [the project's issue tracker on github](https://github.com/waymarkedtrails/waymarked-trails-site/issues). Pred nahlásením chyby sa prosím uistite, že nejde o údaje OSM.
